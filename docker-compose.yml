# ====================================================================================
# DOCKER COMPOSE CONFIGURATION: docker-compose.yml
# ====================================================================================
# Canonical local PostgreSQL stack for KalviNet (must match application-local.yaml
# and .env.example):
#
#   Container : kalvinet-local-dev-db
#   Database  : kalvinet-local-dev
#   User      : postgres
#   Password  : root
#   Host port : 5454  →  container 5432
#   Volume    : kalvinet_local_dev_pgdata
#   JDBC URL  : jdbc:postgresql://localhost:5454/kalvinet-local-dev
#
# Usage:
#   docker compose up -d postgres
#   docker compose down            # keeps volume
#   docker compose down -v         # wipe data for a fresh Flyway migrate
# ====================================================================================

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kalvinet-local-dev-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalvinet-local-dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "${POSTGRES_PORT:-5454}:5432"

    volumes:
      - kalvinet_local_dev_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kalvinet-local-dev}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  kalvinet_local_dev_pgdata:
    name: kalvinet_local_dev_pgdata
