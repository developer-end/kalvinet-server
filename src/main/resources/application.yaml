# ====================================================================================
# APPLICATION CONFIGURATION: application.yaml
# ====================================================================================

# ------------------------------------------------------------------------------------
# SERVER CONFIGURATION
# ------------------------------------------------------------------------------------
# [FUNCTIONALITY]:
#   Configures embedded Tomcat server port (8081) and global REST API context path (/erp).
# [WHY IMPLEMENTED]:
#   Standardizes API routing under `http://localhost:8081/erp/...` to match enterprise microservice pathing.
# [WHAT HAPPENS IF NOT IMPLEMENTED]:
#   Default port 8080 and root path '/' will be used, causing port collisions or broken API client paths.
# ------------------------------------------------------------------------------------
server:
  port: 8081
  servlet:
    context-path: /erp

# ------------------------------------------------------------------------------------
# SPRING FRAMEWORK CONFIGURATION
# ------------------------------------------------------------------------------------
# [FUNCTIONALITY]:
#   Defines application service name, active environment profile ('local'), and lazy bean initialization.
# [WHY IMPLEMENTED]:
#   - `active: local`: Dynamically loads environment properties from `application-local.yaml`.
#   - `lazy-initialization: true`: Speeds up application startup times during development by instantiating beans on demand.
# [WHAT HAPPENS IF NOT IMPLEMENTED]:
#   - Profile-specific database credentials from `application-local.yaml` won't load.
#   - Startup times will be slower due to eager instantiation of all Spring beans.
# ------------------------------------------------------------------------------------
spring:
  application:
    name: KalviNet

  profiles:
    active: local

  main:
    lazy-initialization: true

# ------------------------------------------------------------------------------------
# JPA & HIBERNATE MULTI-TENANCY CONFIGURATION
# ------------------------------------------------------------------------------------
# [FUNCTIONALITY]:
#   Configures Hibernate ORM dialect (PostgreSQL), optimistic DDL management (`ddl-auto: none`),
#   UTC time zone for JDBC connections, and schema-based multi-tenancy (`multiTenancy: SCHEMA`).
# [WHY IMPLEMENTED]:
#   - `ddl-auto: none`: Handled strictly by Flyway database migrations to ensure zero schema corruption.
#   - `multiTenancy: SCHEMA`: Directs Hibernate to route queries to individual tenant PostgreSQL schemas dynamically.
#   - `time_zone: UTC`: Standardizes database timestamp values across server regions.
# [WHAT HAPPENS IF NOT IMPLEMENTED]:
#   - Without `multiTenancy: SCHEMA`, Hibernate cannot isolate tenant data by database schema.
#   - Database timestamps would suffer from time zone inconsistencies across environments.
# ------------------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        multiTenancy: SCHEMA
        jdbc:
          time_zone: UTC

# ------------------------------------------------------------------------------------
# FLYWAY AUTO-MIGRATION CONFIGURATION
# ------------------------------------------------------------------------------------
# [FUNCTIONALITY]:
#   Disables Spring Boot's default single-schema Flyway auto-configuration (`enabled: false`).
# [WHY IMPLEMENTED]:
#   Master and tenant schemas require custom Flyway configuration beans (`MasterFlywayConfig` and `TenantMigrationService`).
# [WHAT HAPPENS IF NOT IMPLEMENTED]:
#   Spring Boot will attempt to run standard single-schema Flyway migrations, conflicting with multi-tenant migration beans.
# ------------------------------------------------------------------------------------
  flyway:
    enabled: false

# ------------------------------------------------------------------------------------
# HIKARICP DATABASE CONNECTION POOL CONFIGURATION
# ------------------------------------------------------------------------------------
# [FUNCTIONALITY]:
#   Configures connection pool metrics (`maximum-pool-size: 15`, `minimum-idle: 5`, timeouts).
# [WHY IMPLEMENTED]:
#   Optimizes database connection reuse across multiple tenant schema requests, preventing connection leaks.
# [WHAT HAPPENS IF NOT IMPLEMENTED]:
#   Default unconstrained connection limits will cause database connection exhaustion under peak user concurrency.
# ------------------------------------------------------------------------------------
  datasource:
    hikari:
      pool-name: kalvinet-hikari-pool
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 60000
      max-lifetime: 1700000

# ------------------------------------------------------------------------------------
# LOGGING CONFIGURATION
# ------------------------------------------------------------------------------------
# [FUNCTIONALITY]:
#   Sets root logging to INFO and logs bound SQL parameters for debugging (`BasicBinder: TRACE`).
# [WHY IMPLEMENTED]:
#   Provides visibility into executed SQL queries during development.
# [WHAT HAPPENS IF NOT IMPLEMENTED]:
#   SQL queries and parameter bindings will not be visible in server application logs.
# ------------------------------------------------------------------------------------
  logging:
    level:
      root: INFO
      org.hibernate.SQL: INFO
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# ------------------------------------------------------------------------------------
# JWT SECURITY & TOKEN EXPIRATION PROPERTIES
# ------------------------------------------------------------------------------------
# [FUNCTIONALITY]:
#   Configures HMAC secret signing key and token expiration durations (15-day access, 2-month refresh).
# [WHY IMPLEMENTED]:
#   Injected into {@link JWTService} and {@link JWTProperties} to sign and validate stateless authentication tokens.
# [WHAT HAPPENS IF NOT IMPLEMENTED]:
#   JWT generation and validation will throw `IllegalArgumentException` due to null secret keys or zero expiration durations.
# ------------------------------------------------------------------------------------
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
  jwt:
    secret: F_n,cPUG(.OYmru-c4mxG4^s)*5$yoKy6gxJ9#t]#=OlkJ%u&R8(Kx_]fwD
    access-token-expire-days: 15
    refresh-token-expire-months: 2
  oauth2:
    frontend-url: ${FRONTEND_URL:http://localhost:4200}

