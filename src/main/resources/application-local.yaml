# ====================================================================================
# ENVIRONMENT PROFILE CONFIGURATION: application-local.yaml
# ====================================================================================
# [FUNCTIONALITY]:
#   Specifies local database connection parameters (driver class, JDBC connection URL, username, password)
#   for the 'local' Spring active profile.
#
# [WHY IMPLEMENTED]:
#   Separates local development credentials (`school-admin` database on localhost) from staging and production
#   configurations, preventing hardcoded credentials in standard application settings.
#
# [WHAT HAPPENS IF NOT IMPLEMENTED]:
#   Spring Boot will fail to create a DataSource connection pool, throwing `Cannot-Get-Jdbc-Connection` or
#   `PSQLException` at application startup.
# ====================================================================================
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/school-admin
    username: postgres
    password: root