# ====================================================================================
# ENVIRONMENT PROFILE CONFIGURATION: application-local.yaml
# ====================================================================================
# Local profile datasource — must match docker-compose.yml / .env.example defaults:
#
#   Host      : localhost
#   Port      : 5454
#   Database  : kalvinet-local-dev
#   User      : postgres
#   Password  : root
#   JDBC URL  : jdbc:postgresql://localhost:5454/kalvinet-local-dev
#
# Override via environment variables or a root `.env` file used by Docker Compose.
# ====================================================================================
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5454}/${POSTGRES_DB:kalvinet-local-dev}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:root}

  jpa:
    hibernate:
      show-sql: true

  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
    oauth2:
      frontend-url: ${FRONTEND_URL:http://localhost:4200}
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:kalvinet-google-client-id.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:kalvinet-google-client-secret}
            scope:
              - openid
              - profile
              - email
